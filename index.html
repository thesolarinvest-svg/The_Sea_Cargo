<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Sea Cargo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .fade-anim { transition: opacity 0.4s ease-in-out; }
  </style>
</head>
<body class="bg-[#0a0d14] text-gray-200 font-sans pb-24 selection:bg-[#00e676] selection:text-black">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-[#10141e]/90 backdrop-blur-md border-b border-gray-800/80 px-4 py-3 flex justify-between items-center max-w-md mx-auto">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-[#00e676] to-[#ffb800] flex items-center justify-center font-black text-black text-sm shadow-md shadow-[#00e676]/20">
        SC
      </div>
      <div>
        <h1 class="text-sm font-extrabold text-white tracking-wider">THE SEA CARGO</h1>
        <p class="text-[10px] text-[#00e676] flex items-center gap-1 font-medium">
          <span class="w-1.5 h-1.5 rounded-full bg-[#00e676] animate-pulse"></span> Platform Active
        </p>
      </div>
    </div>
    <span class="bg-[#ffb800]/20 text-[#ffb800] border border-[#ffb800]/40 text-[11px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1">
      <i class="fa-solid fa-crown text-[9px]"></i> VIP 1
    </span>
  </header>

  <main class="p-4 space-y-4 max-w-md mx-auto">

    <!-- Live Withdrawal Bar (Auto changes every 5 seconds) -->
    <div class="bg-[#121722] border border-gray-800 rounded-xl px-3 py-2.5 flex items-center gap-2 overflow-hidden text-xs">
      <i class="fa-solid fa-bullhorn text-[#ffb800] text-xs shrink-0"></i>
      <div id="withdrawAlert" class="fade-anim text-[11px] text-gray-300 truncate w-full font-medium">
        <span class="text-[#00e676] font-semibold">User 98**12</span> withdraw ₹1,950 successfully
      </div>
    </div>

    <!-- Main Wallet Card -->
    <div class="relative overflow-hidden bg-gradient-to-br from-[#151b27] via-[#101520] to-[#0a0d14] border border-gray-800/80 p-5 rounded-2xl shadow-xl">
      <div class="flex justify-between items-start">
        <div>
          <p class="text-xs text-gray-400 font-medium">Total Available Balance</p>
          <h2 class="text-3xl font-black text-white mt-1 tracking-tight" id="balanceDisplay">₹ 0.00</h2>
        </div>
        <button onclick="location.reload()" class="text-gray-400 hover:text-white transition">
          <i class="fa-solid fa-arrows-rotate text-xs"></i>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-3 mt-5">
        <button onclick="openModal('rechargeModal')" class="flex items-center justify-center gap-2 bg-[#00e676] hover:bg-[#00c853] text-black font-bold py-2.5 rounded-xl text-xs transition active:scale-95 shadow-md shadow-[#00e676]/20">
          <i class="fa-solid fa-wallet"></i> Recharge (Add)
        </button>
        <button onclick="openModal('withdrawModal')" class="flex items-center justify-center gap-2 bg-[#1b2230] hover:bg-[#222a3c] border border-gray-700/80 text-white font-semibold py-2.5 rounded-xl text-xs transition active:scale-95">
          <i class="fa-solid fa-arrow-up-from-bracket"></i> Withdrawal
        </button>
      </div>
    </div>

    <!-- Quick Stats -->
    <div class="grid grid-cols-3 gap-2 text-center text-xs">
      <div class="bg-[#121722] border border-gray-800/80 p-3 rounded-xl">
        <p class="text-[10px] text-gray-400">Daily Cargo
